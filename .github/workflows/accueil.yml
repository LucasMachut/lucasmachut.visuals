# Quand l'accueil est modifié depuis /admin, le CMS n'écrit que
# data/accueil.json. Ce job reconstruit index.html à partir de ce
# fichier et le publie ; le cron d'Hostinger le met en ligne ensuite.
name: Accueil depuis le CMS

on:
  push:
    branches: [master]
    paths:
      - data/accueil.json
      - tools/build_accueil.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accueil
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruire index.html
        run: python tools/build_accueil.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898073+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html déjà à jour."
          else
            git commit -m "Accueil : mise à jour depuis /admin"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
