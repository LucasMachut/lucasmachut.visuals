# L'admin (/admin) écrit partials/ pour les menus et pieds de page.
# L'accueil pessoas est construit par Astro (pessoas.yml) depuis le 31.10.2026 :
# plus d'étape « Accueil » ici, build_accueil.py ne sait pas lire cette page. Ce job
# reconstruit les pages qui en dépendent et les publie ; le cron
# d'Hostinger les met en ligne ensuite.
name: Pages depuis l'admin

on:
  push:
    branches: [master]
    paths:
      - partials/**
      - tools/build_partials.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Menus et pieds de page
        run: python tools/build_partials.py
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898073+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html'
          if git diff --cached --quiet; then
            echo "Pages déjà à jour."
          else
            git commit -m "Pages reconstruites depuis l'admin"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
