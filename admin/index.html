<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Lucas Machut Visuals</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
  <!-- Installable sur le téléphone : « Ajouter à l'écran d'accueil »
       ouvre l'admin comme une application, avec l'icône du logo. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <meta name="theme-color" content="#2E2620" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Admin site" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <!-- Sveltia CMS — https://github.com/sveltia/sveltia-cms
       Version figée : le champ de cadrage (cadrage.js) s'appuie sur son
       API. Pour monter de version, tester d'abord /admin en local.
       Démarrage manuel : cadrage.js enregistre son champ puis lance
       le CMS. -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/@sveltia/cms@0.233.1/dist/sveltia-cms.js" type="module"></script>
  <script src="cadrage.js?v=2" type="module"></script>
</body>
</html>
