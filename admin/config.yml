backend:
  name: github
  repo: LucasMachut/lucasmachut.visuals
  branch: master
  # Login via a GitHub Personal Access Token pasted into the CMS
  # ("Sign In Using Access Token"). No server-side OAuth needed.

# Where uploaded photos are written / linked from.
media_folder: "Projets-web/Fotos"
public_folder: "Projets-web/Fotos"

# CMS interface language
locale: fr

site_url: https://lucasmachut.com/
display_url: https://lucasmachut.com/

# Les photos de l'accueil utilisent le champ « photo_cadree »
# (admin/cadrage.js) : on touche le visage au lieu de taper des
# chiffres. ratio = largeur / hauteur du cadre sur un écran
# d'ordinateur ; mode telephone = ajoute le viseur.

collections:
  # ═══════════ ACCUEIL ═══════════
  - name: accueil
    label: "Accueil"
    delete: false
    files:
      - name: accueil
        label: "Page d'accueil (portugais)"
        file: "data/accueil.json"
        description: "Textes et photos de l'accueil, pour le téléphone et le grand écran. Après « Enregistrer », le site se met à jour en 2 à 4 minutes."
        fields:
          - label: "Ouverture (téléphone)"
            name: abertura
            widget: object
            collapsed: true
            fields:
              - { label: "Ligne tapée sous le logo", name: linha, widget: string }

          - label: "1 · O nome"
            name: nome
            widget: object
            collapsed: true
            fields:
              - { label: "Titre", name: titulo, widget: text, hint: "Retour à la ligne = retour à la ligne dans le titre." }
              - { label: "Texte", name: texto, widget: text }
              - { label: "Ligne des métiers", name: metier, widget: string }
              - { label: "Photo grand écran", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 1.6 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }

          - label: "2 · A memória"
            name: memoria
            widget: object
            collapsed: true
            fields:
              - label: "Texte"
                name: texto
                widget: text
                hint: &hint_texte "Ligne vide = nouveau paragraphe (sur téléphone, le texte se remplace au défilement). Simple retour à la ligne = sur téléphone, la phrase passe en dessous. Une ligne entière *entre astérisques* = italique rose sur téléphone."
              - { label: "Photos grand écran (2)", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 0.98 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }
              - label: "Suite de photos sous le chapitre (téléphone)"
                name: serie_telefone
                widget: list
                required: false
                label_singular: "Photo"
                fields: &serie_telefone
                  - { label: "Photo", name: foto, widget: image }
                  - { label: "Description", name: alt, widget: string, required: false }

          - label: "3 · Cada pessoa"
            name: cada_pessoa
            widget: object
            collapsed: true
            fields:
              - { label: "Texte", name: texto, widget: text, hint: *hint_texte }
              - { label: "Photo grand écran", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 1.82 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }
              - { label: "Suite de photos sous le chapitre (téléphone)", name: serie_telefone, widget: list, required: false, label_singular: "Photo", fields: *serie_telefone }

          - label: "4 · O olhar"
            name: olhar
            widget: object
            collapsed: true
            fields:
              - { label: "Texte", name: texto, widget: text, hint: *hint_texte }
              - { label: "Photos grand écran (4)", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 0.43 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }
              - { label: "Suite de photos sous le chapitre (téléphone)", name: serie_telefone, widget: list, required: false, label_singular: "Photo", fields: *serie_telefone }

          - label: "5 · Os laços"
            name: lacos
            widget: object
            collapsed: true
            fields:
              - { label: "Texte", name: texto, widget: text, hint: *hint_texte }
              - { label: "Photos grand écran (3)", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 0.76 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }
              - { label: "Suite de photos sous le chapitre (téléphone)", name: serie_telefone, widget: list, required: false, label_singular: "Photo", fields: *serie_telefone }

          - label: "6 · Quem a gente é"
            name: quem
            widget: object
            collapsed: true
            fields:
              - { label: "Titre", name: titulo, widget: string, hint: "*mots* = en italique." }
              - { label: "Photos grand écran (3)", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 0.76 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }
              - { label: "Suite de photos sous le chapitre (téléphone)", name: serie_telefone, widget: list, required: false, label_singular: "Photo", fields: *serie_telefone }

          - label: "Respiration (grand écran)"
            name: respiracao
            widget: object
            collapsed: true
            fields:
              - { label: "Photo seule, sans texte", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 1.67 } }

          - label: "Autoportrait (grand écran)"
            name: autorretrato
            widget: object
            collapsed: true
            fields:
              - { label: "Photos (2)", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 0.98 } }

          - label: "Album de tirages (téléphone)"
            name: album
            widget: object
            collapsed: true
            fields:
              - label: "Tirages"
                name: tirages
                widget: list
                label_singular: "Tirage"
                fields:
                  - { label: "Photo", name: foto, widget: image }
                  - { label: "Description", name: alt, widget: string, required: false }
                  - { label: "Sens", name: sens, widget: select, default: "h", options: [{ label: "Horizontale", value: "h" }, { label: "Verticale", value: "v" }] }

          - label: "7 · O que eu faço"
            name: prestacoes
            widget: list
            collapsed: true
            label_singular: "Prestation"
            summary: "{{fields.titulo}}"
            fields:
              - { label: "Titre", name: titulo, widget: string }
              - { label: "Texte", name: texto, widget: text }

          - label: "8 · Hotéis"
            name: hoteis
            widget: object
            collapsed: true
            fields:
              - { label: "Titre", name: titulo, widget: string, hint: "*mots* = en italique." }
              - { label: "Texte", name: texto, widget: text }
              - { label: "Photo grand écran", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 1.67 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }

          - label: "9 · Contato"
            name: contato
            widget: object
            collapsed: true
            fields:
              - { label: "Titre", name: titulo, widget: string, hint: "*mots* = en italique." }
              - { label: "Photo grand écran", name: fotos_grande, widget: list, allow_add: false, allow_remove: false, field: { label: "Photo", name: foto, widget: photo_cadree, ratio: 1.6 } }
              - { label: "Photo téléphone", name: foto_telefone, widget: photo_cadree, mode: telephone }

  # ═══════════ PORTFÓLIO ═══════════
  - name: galerie
    label: "Portfólio"
    delete: false
    files:
      - name: fotos
        label: "Séries de photos"
        file: "data/fotos.json"
        description: "Ajoute, supprime ou réordonne les séries et leurs photos. Clique « Publier » pour mettre le site à jour (~3 min)."
        fields:
          - label: "Séries"
            name: series
            widget: list
            label_singular: "Série"
            collapsed: true
            summary: "{{fields.title_pt}} — {{fields.photos.length}} photos"
            fields:
              - label: "Identifiant technique"
                name: slug
                widget: string
                hint: "Ne pas modifier (sert de dossier interne)."
              - { label: "Titre — Portugais", name: title_pt, widget: string }
              - { label: "Titre — Anglais", name: title_en, widget: string }
              - { label: "Titre — Français", name: title_fr, widget: string }
              - { label: "Type — Portugais", name: type_pt, widget: string, required: false, hint: "Ex. Evento, Ensaio, Casamento" }
              - { label: "Type — Anglais", name: type_en, widget: string, required: false }
              - { label: "Type — Français", name: type_fr, widget: string, required: false }
              - { label: "Lieu", name: location, widget: string, required: false, hint: "Ex. Rio de Janeiro, RJ" }
              - label: "Vitrine du portfólio"
                name: destaque
                widget: list
                required: false
                label_singular: "Photo"
                hint: "Les photos montrées sur la page portfólio, dans l'ordre. Vide = les 8 premières photos de la série."
                field: { label: "Image", name: image, widget: image }
              - label: "Toutes les photos de la série"
                name: photos
                widget: list
                label_singular: "Photo"
                field: { label: "Image", name: image, widget: image }
              - { label: "Page du projet", name: page, widget: string, required: false, hint: "Ne pas modifier. Ex. arpoador.html — ajoute un bouton vers cette page." }
              - label: "Films"
                name: videos
                widget: list
                required: false
                label_singular: "Film"
                hint: "Ne pas modifier sans Claude."
                fields:
                  - { label: "Identifiant YouTube", name: id, widget: string }
                  - { label: "Titre", name: title, widget: string, required: false }
